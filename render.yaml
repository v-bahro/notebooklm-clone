databases:
  - name: quellwerk-db
    databaseName: quellwerk
    user: quellwerk
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: quellwerk-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quellwerk-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://quellwerk.netlify.app
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
